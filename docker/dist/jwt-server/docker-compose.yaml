services:
  keycloak:
    init: true
    build: keycloak
    hostname: keycloak
    container_name: gfarm-keycloak
    volumes:
      - ./keycloak:/keycloak
      - ../minica/keycloak/cert.pem:/etc/x509/https/tls.crt
      - ../minica/keycloak/key.pem:/etc/x509/https/tls.key
    environment:
      DB_VENDOR: h2
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
    networks:
      gfarm_net:
    ports:
      - 8080:8080
      - 8443:8443
  setup-keycloak:
    build: setup-keycloak
    image: gfarm-setup-keycloak
    hostname: setup-keycloak
    container_name: gfarm-setup-keycloak
    volumes:
      - ../minica/minica.pem:/myca.pem:ro
      - ./setup-keycloak:/setup-keycloak:ro
    networks:
      gfarm_net:
  jwt-server:
    build: jwt-server
    hostname: jwt-server
    container_name: gfarm-jwt-server
    volumes:
      - ../minica/minica.pem:/usr/share/pki/ca-trust-source/anchors/minica.crt
      - ../minica/jwt-server/cert.pem:/etc/pki/tls/certs/localhost.crt
      - ../minica/jwt-server/key.pem:/etc/pki/tls/private/localhost.key
      - ./jwt-server:/jwt
    networks:
      - gfarm_net
    privileged: true
  jwt-server2:
    build: jwt-server
    hostname: jwt-server2
    container_name: gfarm-jwt-server2
    volumes:
      - ../minica/minica.pem:/usr/share/pki/ca-trust-source/anchors/minica.crt
      - ../minica/jwt-server2/cert.pem:/etc/pki/tls/certs/localhost.crt
      - ../minica/jwt-server2/key.pem:/etc/pki/tls/private/localhost.key
      - ./jwt-server:/jwt
    networks:
      - gfarm_net
    privileged: true
  rdesktop:
    init: true
    build: rdesktop
    container_name: gfarm-rdesktop
    volumes:
      - ../minica/minica.pem:/minica/minica.pem
      - ./rdesktop:/rdesktop
    networks:
      - gfarm_net
    ports:
      - 13389:3389
  squid:
    init: true
    image: ubuntu/squid
    container_name: gfarm-squid
    networks:
      gfarm_net:
    ports:
      - 13128:3128
    volumes:
      - ../../dev/common/oauth2/allow-ssl-ports.conf:/etc/squid/conf.d/allow-ssl-ports.conf:ro

networks:
  gfarm_net:
    name: gfarm_net
    external: true
