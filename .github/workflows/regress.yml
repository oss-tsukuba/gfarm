name: regress with sharedsecret

on:
  push:
  pull_request:

jobs:

  regress:
    name: Run regress with sharedsecret authentication
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker compose build
        id: compose
        run: |
          cd docker/dist
          sh ./minica.sh
          docker compose build --build-arg UID=$(id -u) c1

      - name: docker compose up
        id: up
        run: |
          cd docker/dist
          docker compose up -d

      - name: build_all
        id: build_all
        run: |
          cd docker/dist
          docker exec -u ${USER} -w /home/${USER}/gfarm/docker/dist gfarm-c1 \
             sh ./all.sh

      - name: regress_gfarm
        id: regress_gfarm
        run: |
          cd docker/dist
          docker exec -u ${USER} -w /home/${USER}/gfarm/docker/dist gfarm-c1 \
             sh ./regress.sh

      - name: extract log files from the container
        if: always()
        run: |
          mkdir -p regress-log
          DIST=$(docker exec gfarm-c1 gfarm.arch.guess)
          docker exec -u ${USER} -w /home/${USER}/gfarm/build-${DIST}/regress \
              gfarm-c1 sh -c 'tar cf - log.*' | ( cd regress-log && tar pxf - )

      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-log
          path: regress-log/*
