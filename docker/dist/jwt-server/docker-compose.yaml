services:
  ### for Keycloak 20 or later
  keycloak:
    init: true
    image: keycloak/keycloak:26.2
    hostname: keycloak
    container_name: gfarm-keycloak
    command:
      #- start-dev
      - start
    networks:
      gfarm_net:
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../minica/keycloak/:/opt/keycloak/minica-cert:ro
    environment:
      # https://www.keycloak.org/server/all-config
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
      # https://www.keycloak.org/server/enabletls
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/minica-cert/cert.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/minica-cert/key.pem
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_HTTPS_PORT=8443
      - KC_HTTP_PORT=8080
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HTTP_MANAGEMENT_PORT=443
      - KC_HEALTH_ENABLED=true   # :443/auth/health
      - KC_METRICS_ENABLED=true  # :443/auth/metrics
      - KC_LOG_LEVEL=INFO
  setup-keycloak:
    build: setup-keycloak
    image: gfarm-setup-keycloak
    hostname: setup-keycloak
    container_name: gfarm-setup-keycloak
    volumes:
      - ../minica/minica.pem:/myca.pem:ro
      - ./setup-keycloak:/setup-keycloak:ro
    networks:
      gfarm_net:
  jwt-server:
    build: jwt-server
    hostname: jwt-server
    container_name: gfarm-jwt-server
    volumes:
      - ../minica/minica.pem:/usr/share/pki/ca-trust-source/anchors/minica.crt
      - ../minica/jwt-server/cert.pem:/etc/pki/tls/certs/localhost.crt
      - ../minica/jwt-server/key.pem:/etc/pki/tls/private/localhost.key
      - ./jwt-server:/jwt
    networks:
      - gfarm_net
    privileged: true
  jwt-server2:
    build: jwt-server
    hostname: jwt-server2
    container_name: gfarm-jwt-server2
    volumes:
      - ../minica/minica.pem:/usr/share/pki/ca-trust-source/anchors/minica.crt
      - ../minica/jwt-server2/cert.pem:/etc/pki/tls/certs/localhost.crt
      - ../minica/jwt-server2/key.pem:/etc/pki/tls/private/localhost.key
      - ./jwt-server:/jwt
    networks:
      - gfarm_net
    privileged: true
  rdesktop:
    init: true
    build: rdesktop
    container_name: gfarm-rdesktop
    volumes:
      - ../minica/minica.pem:/minica/minica.pem
      - ./rdesktop:/rdesktop
    networks:
      - gfarm_net
    ports:
      - 13389:3389
  squid:
    init: true
    image: ubuntu/squid
    container_name: gfarm-squid
    networks:
      gfarm_net:
    ports:
      - 13128:3128
    volumes:
      - ../../dev/common/oauth2/allow-ssl-ports.conf:/etc/squid/conf.d/allow-ssl-ports.conf:ro

networks:
  gfarm_net:
    name: gfarm_net
    external: true

volumes:
  keycloak-data:
