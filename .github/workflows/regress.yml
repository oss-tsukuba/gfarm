name: regress with sharedsecret

on:
  push:
  pull_request:

jobs:

  regress:
    name: Run regress with sharedsecret authentication (${{ matrix.target }})
    runs-on: ubuntu-latest
    # run the regression test with the root privilege and the one as
    # a user in parallel, on separate clusters
    strategy:
      fail-fast: false
      matrix:
        target: [ root, user ]

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: get user
        id: user
        run: |
          echo "name=$(id -un)" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"

      - name: build minica image
        uses: docker/build-push-action@v7
        with:
          context: docker/dist/minica
          tags: gfarm-minica
          load: true
          cache-from: type=gha,scope=gfarm-minica
          cache-to: type=gha,mode=max,scope=gfarm-minica

      - name: build gfarm image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dist/ubuntu/Dockerfile
          tags: gfarm-ubuntu
          load: true
          build-args: |
            USERNAME=${{ steps.user.outputs.name }}
            UID=${{ steps.user.outputs.uid }}
          cache-from: type=gha,scope=gfarm-ubuntu
          cache-to: type=gha,mode=max,scope=gfarm-ubuntu

      - name: create certificates
        id: compose
        run: |
          cd docker/dist
          MINICA_SKIP_BUILD=1 sh ./minica.sh

      - name: docker compose up
        id: up
        run: |
          cd docker/dist
          docker compose up -d --no-build

      - name: build_all
        id: build_all
        run: |
          cd docker/dist
          docker exec -u ${USER} -w /home/${USER}/gfarm/docker/dist gfarm-c1 \
             sh ./all.sh

      - name: regress_gfarm
        id: regress_gfarm
        run: |
          cd docker/dist
          docker exec -u ${USER} -w /home/${USER}/gfarm/docker/dist gfarm-c1 \
             sh ./regress.sh ${{ matrix.target }}

      # gfarm2fs is cloned and installed by all.sh.
      # fuse3, libfuse3-dev and valgrind are included in the image.
      # run it only in one of the jobs.
      - name: regress_gfarm2fs
        id: regress_gfarm2fs
        if: ${{ !cancelled() && steps.build_all.outcome == 'success' && matrix.target == 'user' }}
        run: |
          set -o pipefail
          mkdir -p regress-log
          docker exec -u ${USER} gfarm-c1 gfmkdir -p -m 1777 /tmp
          docker exec \
             -e REGRESS_MODES="default --asan --tsan" \
             -u ${USER} -w /home/${USER}/gfarm/gfarm2fs/regress gfarm-c1 \
             bash ./regress-matrix.sh 2>&1 | tee regress-log/log.regress-gfarm2fs

      - name: extract log files from the container
        if: always()
        run: |
          mkdir -p regress-log
          DIST=$(docker exec gfarm-c1 gfarm.arch.guess)
          docker exec -u ${USER} -w /home/${USER}/gfarm/build-${DIST}/regress \
              gfarm-c1 sh -c 'tar cf - log.*' | ( cd regress-log && tar pxf - )

      - name: upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regress-log-${{ matrix.target }}
          path: regress-log/*
